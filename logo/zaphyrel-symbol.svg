<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" role="img" aria-label="Zaphyrel">
  <defs>
    <!-- Paleta Pastel Coolors oficial: #81BDF8 · #A9DCFF · #D5BEFF · #FFD5FF · #FF9AFF -->
    <linearGradient id="z6-crown" x1="0.06" y1="0.06" x2="0.94" y2="0.94">
      <stop offset="0" stop-color="#81BDF8"/>
      <stop offset="0.28" stop-color="#A9DCFF"/>
      <stop offset="0.54" stop-color="#D5BEFF"/>
      <stop offset="0.78" stop-color="#FFD5FF"/>
      <stop offset="1" stop-color="#FF9AFF"/>
    </linearGradient>
    <linearGradient id="z6-table" x1="0.08" y1="0.05" x2="0.92" y2="0.95">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.32" stop-color="#DCEEFF"/>
      <stop offset="0.65" stop-color="#EBE0FF"/>
      <stop offset="1" stop-color="#FFE6FF"/>
    </linearGradient>
    <linearGradient id="z6-f-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#81BDF8"/>
      <stop offset="1" stop-color="#A9DCFF"/>
    </linearGradient>
    <linearGradient id="z6-f-lav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9DCFF"/>
      <stop offset="1" stop-color="#D5BEFF"/>
    </linearGradient>
    <linearGradient id="z6-f-orc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD5FF"/>
      <stop offset="1" stop-color="#FF9AFF"/>
    </linearGradient>
    <linearGradient id="z6-obs" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#202534"/>
      <stop offset="0.5" stop-color="#0B0D14"/>
      <stop offset="1" stop-color="#05060A"/>
    </linearGradient>
    <linearGradient id="z6-wind" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#81BDF8"/>
      <stop offset="0.6" stop-color="#A9DCFF"/>
      <stop offset="1" stop-color="#D5BEFF"/>
    </linearGradient>
    <clipPath id="z6-clip-tbl">
      <polygon points="58,28 62,28 92,58 92,62 62,92 58,92 28,62 28,58"/>
    </clipPath>
  </defs>

  <!-- Facetas exactas de corona octogonal alineadas a las aristas a 45° -->
  <polygon points="19,51 57,13 58,28 28,58" fill="url(#z6-f-sky)" opacity=".92"/>
  <polygon points="57,13 63,13 62,28 58,28" fill="#FFFFFF"/>
  <polygon points="63,13 107,57 92,58 62,28" fill="url(#z6-f-lav)" opacity=".92"/>
  <polygon points="107,57 107,63 92,62 92,58" fill="#FFD5FF"/>
  <polygon points="107,63 63,107 62,92 92,62" fill="url(#z6-f-orc)" opacity=".95"/>
  <polygon points="63,107 57,107 58,92 62,92" fill="#D5BEFF"/>
  <polygon points="57,107 41,91 49,83 58,92" fill="url(#z6-f-sky)" opacity=".88"/>

  <!-- Tabla interior luminosa de Zafiro -->
  <polygon points="58,28 62,28 92,58 92,62 62,92 58,92 28,62 28,58" fill="url(#z6-table)"/>
  <g clip-path="url(#z6-clip-tbl)">
    <polygon points="24,52 60,18 78,36 24,78" fill="#FFFFFF" opacity=".52"/>
    <polygon points="62,60 94,58 94,76 60,96" fill="#FF9AFF" opacity=".26"/>
    <polygon points="26,60 58,26 60,60 28,72" fill="#81BDF8" opacity=".22"/>
    <path d="M 28 58 L 92 62 M 58 28 L 62 92 M 38 38 L 82 82 M 82 38 L 38 82" stroke="#FFFFFF" stroke-width="0.7" stroke-opacity=".6"/>
  </g>

  <!-- Aristas de talla de precisión -->
  <polygon points="58,28 62,28 92,58 92,62 62,92 58,92 28,62 28,58" fill="none" stroke="url(#z6-crown)" stroke-width="1.35" stroke-linejoin="round"/>
  <path d="M 57 13 L 58 28 M 63 13 L 62 28 M 107 57 L 92 58 M 107 63 L 92 62 M 63 107 L 62 92 M 57 107 L 58 92 M 19 51 L 28 58 M 41 91 L 49 83" fill="none" stroke="#FFFFFF" stroke-width="1.05" stroke-opacity=".8" stroke-linecap="round"/>

  <!-- Corona abierta del Zafiro: marco obsidiana + trazo luminoso Coolors -->
  <path d="M 19 51 L 57 13 L 63 13 L 107 57 L 107 63 L 63 107 L 57 107 L 41 91" fill="none" stroke="#11141D" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 19 51 L 57 13 L 63 13 L 107 57 L 107 63 L 63 107 L 57 107 L 41 91" fill="none" stroke="url(#z6-crown)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Estelas Zéfiro en corte biselado 45° entrando por el umbral abierto -->
  <path d="M 16 55 H 27.5 L 24 58 H 16 Z" fill="#81BDF8"/>
  <path d="M 8 61.8 H 28.5 L 24.5 65.8 H 8 Z" fill="url(#z6-wind)"/>
  <path d="M 14 69.8 H 31.5 L 27.5 73.6 H 14 Z" fill="url(#z6-f-lav)"/>

  <!-- Monograma Z escultórico (silueta fiel con sombra cristalina, cuerpo obsidiana y filo platino) -->
  <path d="M 41 39.5 H 72.5 L 66.5 45.8 H 35 Z M 53.5 74.2 H 85 L 79 80.5 H 47.5 Z M 76.5 39.5 H 84.5 C 71.5 54, 59.5 66, 45.5 80.5 H 37.5 C 50.5 66, 62.5 54, 76.5 39.5 Z" fill="#06070B" opacity=".24" transform="translate(1.4,2)"/>
  <path d="M 41 39.5 H 72.5 L 66.5 45.8 H 35 Z M 53.5 74.2 H 85 L 79 80.5 H 47.5 Z M 76.5 39.5 H 84.5 C 71.5 54, 59.5 66, 45.5 80.5 H 37.5 C 50.5 66, 62.5 54, 76.5 39.5 Z" fill="url(#z6-obs)" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 40.5 40.3 H 71.2 L 69.5 41.8 H 38.8 Z M 77.2 40.3 H 83 C 71 53.5, 59.5 65, 45.8 79.3 H 43.8 C 57.5 65, 69 53.5, 77.2 40.3 Z" fill="#FFFFFF" opacity=".32"/>
</svg>
