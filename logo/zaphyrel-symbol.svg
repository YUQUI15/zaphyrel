<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" role="img" aria-label="Zaphyrel">
  <defs>
    <linearGradient id="zg" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#6F8EB5"/>
      <stop offset="0.55" stop-color="#8FA8CA"/>
      <stop offset="1" stop-color="#B9C9DF"/>
    </linearGradient>
    <linearGradient id="zf-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B6C9E2" stop-opacity=".34"/>
      <stop offset="1" stop-color="#8DA8CA" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="zf-lo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6F8EB5" stop-opacity=".16"/>
      <stop offset="1" stop-color="#9EB5D6" stop-opacity=".28"/>
    </linearGradient>
  </defs>
  <!-- Facetas exactas de corona octogonal alineadas a las aristas -->
  <polygon points="24,46 57,13 58,28 34,50" fill="url(#zf-hi)" opacity=".7"/>
  <polygon points="57,13 63,13 62,28 58,28" fill="url(#zf-hi)"/>
  <polygon points="63,13 107,57 92,58 62,28" fill="url(#zf-lo)"/>
  <polygon points="107,57 107,63 92,62 92,58" fill="url(#zf-hi)"/>
  <polygon points="107,63 63,107 62,92 92,62" fill="url(#zf-lo)" opacity=".85"/>

  <!-- Corona abierta del zafiro -->
  <path d="M 19 51 L 57 13 L 63 13 L 107 57 L 107 63 L 63 107 L 57 107 L 41 91" fill="none" stroke="url(#zg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tabla interior y aristas exactas de talla -->
  <polygon points="58,28 62,28 92,58 92,62 62,92 58,92 28,62 28,58" fill="none" stroke="#7A97BC" stroke-width="1.15" stroke-opacity=".46" stroke-linejoin="round"/>
  <path d="M 57 13 L 58 28 M 63 13 L 62 28 M 107 57 L 92 58 M 107 63 L 92 62 M 63 107 L 62 92 M 57 107 L 58 92" fill="none" stroke="#7A97BC" stroke-width="1" stroke-opacity=".42" stroke-linecap="round"/>

  <!-- Estelas Zefiro en corte biselado 45° -->
  <path d="M 10 62.5 H 28 L 24 66 H 10 Z M 16 70.5 H 31 L 27.5 74 H 16 Z" fill="#84A1C6" opacity=".78"/>

  <!-- Monograma Z escultorico en corte 45° y pausa negativa de luz -->
