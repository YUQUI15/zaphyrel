      <stop offset="0" stop-color="#81BDF8"/>
      <stop offset="0.28" stop-color="#A9DCFF"/>
      <stop offset="0.54" stop-color="#D5BEFF"/>
      <stop offset="0.78" stop-color="#FFD5FF"/>
      <stop offset="1" stop-color="#FF9AFF"/>
    </linearGradient>
    <linearGradient id="z9-table" x1="0.06" y1="0.04" x2="0.94" y2="0.96">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.30" stop-color="#E4F2FF"/>
      <stop offset="0.65" stop-color="#EDE4FF"/>
      <stop offset="1" stop-color="#FFE7FF"/>
    </linearGradient>
    <linearGradient id="z9-f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#81BDF8"/><stop offset="1" stop-color="#A9DCFF"/></linearGradient>
    <linearGradient id="z9-f2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A9DCFF"/><stop offset="1" stop-color="#D5BEFF"/></linearGradient>
    <linearGradient id="z9-f3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD5FF"/><stop offset="1" stop-color="#FF9AFF"/></linearGradient>
    <linearGradient id="z9-obs" x1="0.12" y1="0.04" x2="0.88" y2="0.96">
      <stop offset="0" stop-color="#252C40"/>
      <stop offset="0.48" stop-color="#0C0F17"/>
      <stop offset="1" stop-color="#040508"/>
    </linearGradient>
    <linearGradient id="z9-wind" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#81BDF8"/>
      <stop offset="0.6" stop-color="#A9DCFF"/>
      <stop offset="1" stop-color="#D5BEFF"/>
    </linearGradient>
    <clipPath id="z9-clip-tbl">
