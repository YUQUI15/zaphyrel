    <filter id="z9-zdrop" x="-22%" y="-22%" width="144%" height="148%">
      <feDropShadow dx="0" dy="2.6" stdDeviation="2.1" flood-color="#05070C" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Facetas exteriores octogonales a 45° -->
  <polygon points="19,51 57,13 57.5,26.5 26.5,57.5" fill="url(#z9-f1)"/>
  <polygon points="57,13 63,13 62.5,26.5 57.5,26.5" fill="#FFFFFF"/>
  <polygon points="63,13 107,57 93.5,57.5 62.5,26.5" fill="url(#z9-f2)"/>
  <polygon points="107,57 107,63 93.5,62.5 93.5,57.5" fill="#FFD5FF"/>
  <polygon points="107,63 63,107 62.5,93.5 93.5,62.5" fill="url(#z9-f3)"/>
  <polygon points="63,107 57,107 57.5,93.5 62.5,93.5" fill="#D5BEFF"/>
  <polygon points="57,107 41,91 49.5,82.5 57.5,93.5" fill="url(#z9-f1)"/>

  <!-- Tabla cristalina interior con anillo relojero -->
  <polygon points="57.5,26.5 62.5,26.5 93.5,57.5 93.5,62.5 62.5,93.5 57.5,93.5 26.5,62.5 26.5,57.5" fill="url(#z9-table)"/>
  <g clip-path="url(#z9-clip-tbl)">
