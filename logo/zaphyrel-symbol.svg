    <polygon points="60,60 95,58 95,78 58,96" fill="#FF9AFF" opacity=".16"/>
    <polygon points="25,61 59,25 60,60 28,74" fill="#81BDF8" opacity=".16"/>
    <polygon points="58,32.5 62,32.5 87.5,58 87.5,62 62,87.5 58,87.5 32.5,62 32.5,58" fill="none" stroke="#FFFFFF" stroke-width="0.9" stroke-opacity=".88"/>
  </g>
  <polygon points="57.5,26.5 62.5,26.5 93.5,57.5 93.5,62.5 62.5,93.5 57.5,93.5 26.5,62.5 26.5,57.5" fill="none" stroke="url(#z9-crown)" stroke-width="1.25" stroke-linejoin="round"/>
  <path d="M 57 13 L 57.5 26.5 M 63 13 L 62.5 26.5 M 107 57 L 93.5 57.5 M 107 63 L 93.5 62.5 M 63 107 L 62.5 93.5 M 57 107 L 57.5 93.5 M 19 51 L 26.5 57.5 M 41 91 L 49.5 82.5" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-opacity=".88" stroke-linecap="round"/>

  <!-- Marco Octogonal Abierto Dual -->
  <path d="M 19 51 L 57 13 L 63 13 L 107 57 L 107 63 L 63 107 L 57 107 L 41 91" fill="none" stroke="#0B0D14" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 19 51 L 57 13 L 63 13 L 107 57 L 107 63 L 63 107 L 57 107 L 41 91" fill="none" stroke="url(#z9-crown)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tres Estelas Zéfiro biseladas -->
  <path d="M 15 54 H 28 L 24.2 57.6 H 15 Z" fill="#81BDF8"/>
  <path d="M 7 61 H 30.2 L 25.6 65.4 H 7 Z" fill="url(#z9-wind)"/>
  <path d="M 12.5 69.2 H 33.4 L 29 73.2 H 12.5 Z" fill="url(#z9-f2)"/>

  <!-- Monograma Z Didot-Fluid v9: Trazos ondeantes finos de alta costura + travesaño prismático -->
