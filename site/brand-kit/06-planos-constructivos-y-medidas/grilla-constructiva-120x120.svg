  <text x="80" y="340" font-family="monospace" font-size="11" fill="#434B5E">RESPETO MÍNIMO = 0.25X (30u en retícula 120u) | BIZEL CORONA = 45° | CANAL = y60</text>
  <g transform="translate(385,48)" font-family="sans-serif" fill="#090B10">
    <text x="0" y="0" font-size="16" font-weight="700">ESPECIFICACIÓN TÉCNICA</text>
    <text x="0" y="28" font-size="12" fill="#434B5E">• Lienzo Matriz: 120 × 120 u (1:1)</text>
    <text x="0" y="50" font-size="12" fill="#434B5E">• Corona Exterior: 7 facetas abiertas</text>
    <text x="0" y="72" font-size="12" fill="#434B5E">• Ángulo Bisel: 45° constantes</text>
    <text x="0" y="94" font-size="12" fill="#434B5E">• Canal Split-Blade: Horizontal y=60</text>
    <text x="0" y="116" font-size="12" fill="#434B5E">• Impulso Lateral: 3 haces progresivos</text>
    <text x="0" y="150" font-size="14" font-weight="700">TAMAÑOS MÍNIMOS</text>
    <text x="0" y="174" font-size="12" fill="#434B5E">• Digital Isotipo: 24 × 24 px</text>
    <text x="0" y="196" font-size="12" fill="#434B5E">• Digital + Eslogan: 180 px ancho</text>
    <text x="0" y="218" font-size="12" fill="#434B5E">• Impresión Isotipo: 12 mm alto</text>
    <text x="0" y="240" font-size="12" fill="#434B5E">• Impresión Completa: 38 mm ancho</text>
  </g>
