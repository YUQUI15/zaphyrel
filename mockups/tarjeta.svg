      <text x="34" y="166">hola@zaphyrel.com</text>
      <text x="34" y="188">+51 000 000 000</text>
      <text x="34" y="210">zaphyrel.com</text>
    </g>
    <g transform="translate(322,142) scale(.68)">
      <polygon points="60,9 26,43 37,49 60,26" fill="url(#zf1)"/>
      <polygon points="60,9 111,60 94,60 60,26" fill="url(#zf2)"/>
      <polygon points="111,60 60,111 60,94 94,60" fill="url(#zf2)" opacity=".88"/>
      <path d="M 15 54 L 60 9 L 111 60 L 60 111 L 41 92" fill="none" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="60,25 95,60 60,95 25,60" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-opacity=".55" stroke-linejoin="round"/>
      <path d="M 60 9 V 25 M 111 60 H 95 M 60 111 V 95 M 10 68 C 19 68, 25 72, 33 72 M 16 78 C 23 78, 27 80, 32 80" fill="none" stroke="url(#g)" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M 38 41 H 81 L 78.5 46 H 41 Z M 41.5 74 H 82 L 79.5 79 H 39 Z M 73.5 41 H 81 C 71 54, 58 66, 46.5 79 H 39 C 49 66, 61.5 54, 73.5 41 Z" fill="#F6F3FF"/>
    </g>
    <text x="34" y="242" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="13" fill="#BDB6D6">Esencia que permanece e innovación que fluye</text>
