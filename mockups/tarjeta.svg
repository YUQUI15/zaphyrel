    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2B2540" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1050" height="600" fill="#ECE6DC"/>
  <g transform="translate(60,70)" filter="url(#sh)">
