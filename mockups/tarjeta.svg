  <text x="270" y="400" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="2.5" fill="#7D7594">ANVERSO · papel marfil mate, símbolo facetado en relieve seco</text>
  <text x="780" y="400" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="2.5" fill="#7D7594">REVERSO · ciruela noche, filo degradado</text>
