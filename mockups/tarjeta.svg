  <g transform="translate(570,70)" filter="url(#sh)">
    <rect width="420" height="260" rx="14" fill="#171324"/>
    <rect width="420" height="5" rx="3" fill="url(#g)"/>
    <text x="34" y="80" font-family="'Cormorant Garamond', Georgia, serif" font-weight="600" font-size="28" fill="#F6F3FF">Nombre Apellido</text>
    <text x="34" y="104" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10.5" letter-spacing="3" fill="#B8A9FF">FUNDADOR · SISTEMAS A MEDIDA</text>
