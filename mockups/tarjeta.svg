<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&amp;family=Plus+Jakarta+Sans:wght@400;500&amp;display=swap');</style>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5E8CE3"/><stop offset=".52" stop-color="#927CE0"/><stop offset="1" stop-color="#E58D78"/></linearGradient>
    <linearGradient id="zf1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8AB4FF" stop-opacity=".28"/><stop offset="1" stop-color="#B8A9FF" stop-opacity=".12"/></linearGradient>
    <linearGradient id="zf2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B8A9FF" stop-opacity=".24"/><stop offset="1" stop-color="#F7B7A6" stop-opacity=".28"/></linearGradient>
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset in="SourceAlpha" dx="-1.2" dy="-1.2" result="hi"/><feFlood flood-color="#fff" flood-opacity=".95"/><feComposite in2="hi" operator="in" result="hiC"/>
      <feOffset in="SourceAlpha" dx="1.4" dy="1.6" result="lo"/><feFlood flood-color="#2B2540" flood-opacity=".22"/><feComposite in2="lo" operator="in" result="loC"/>
