      <path d="M 38 41 H 81 L 78.5 46 H 41 Z M 41.5 74 H 82 L 79.5 79 H 39 Z M 73.5 41 H 81 C 71 54, 58 66, 46.5 79 H 39 C 49 66, 61.5 54, 73.5 41 Z" fill="#E5DED2"/>
