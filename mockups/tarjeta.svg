<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FAEE0"/><stop offset=".5" stop-color="#B0A3DE"/><stop offset="1" stop-color="#E6AC99"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9CDEB" stop-opacity=".5"/><stop offset="1" stop-color="#F3CDBF" stop-opacity=".5"/></linearGradient>
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset in="SourceAlpha" dx="-1.2" dy="-1.2" result="hi"/><feFlood flood-color="#fff" flood-opacity=".95"/><feComposite in2="hi" operator="in" result="hiC"/>
      <feOffset in="SourceAlpha" dx="1.4" dy="1.6" result="lo"/><feFlood flood-color="#2B2540" flood-opacity=".22"/><feComposite in2="lo" operator="in" result="loC"/>
      <feMerge><feMergeNode in="loC"/><feMergeNode in="hiC"/></feMerge>
    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2B2540" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1050" height="600" fill="#EFE9E0"/>
  <!-- Anverso -->
  <g transform="translate(60,70)" filter="url(#sh)">
    <rect width="420" height="260" rx="12" fill="#FAF7F2"/>
    <g transform="translate(150,36) scale(1.04)" filter="url(#emboss)">
      <path d="M 16 54 L 60 10 L 110 60 L 60 110 L 42 92" fill="none" stroke="#E9E3DA" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 27 60 L 60 27 L 93 60 L 60 93 Z" fill="none" stroke="#E9E3DA" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 60 10 V 27 M 110 60 H 93 M 60 110 V 93" fill="none" stroke="#E9E3DA" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 38 43 H 80 C 68 53 52 67 40 77 H 83" fill="none" stroke="#E9E3DA" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 21 77 H 31" fill="none" stroke="#E9E3DA" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 91 20 L 92.6 25.4 L 98 27 L 92.6 28.6 L 91 34 L 89.4 28.6 L 84 27 L 89.4 25.4 Z" fill="#E9E3DA"/>
    </g>
    <text x="210" y="208" text-anchor="middle" font-family="Fraunces,'Cormorant Garamond',Georgia,serif" font-size="22" letter-spacing="9" fill="#2B2540">ZAPHYREL</text>
  </g>
  <!-- Reverso -->
  <g transform="translate(570,70)" filter="url(#sh)">
    <rect width="420" height="260" rx="12" fill="#1D192B"/>
    <rect width="420" height="5" rx="3" fill="url(#g)"/>
    <text x="34" y="80" font-family="Fraunces,Georgia,serif" font-size="25" fill="#FAF7F2">Nombre Apellido</text>
    <text x="34" y="104" font-family="Manrope,'Segoe UI',sans-serif" font-size="11" letter-spacing="3" fill="#C9C1E8">FUNDADOR · SISTEMAS A MEDIDA</text>
    <g font-family="Manrope,'Segoe UI',sans-serif" font-size="12.5" fill="#E7E2F3" letter-spacing=".6">
      <text x="34" y="166">hola@zaphyrel.com</text>
      <text x="34" y="188">+51 000 000 000</text>
      <text x="34" y="210">zaphyrel.com</text>
    </g>
    <g transform="translate(324,145) scale(.66)">
      <path d="M 16 54 L 60 10 L 110 60 L 60 110 L 42 92" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 27 60 L 60 27 L 93 60 L 60 93 Z" fill="none" stroke="url(#gl)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 60 10 V 27 M 110 60 H 93 M 60 110 V 93" fill="none" stroke="url(#gl)" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 38 43 H 80 C 68 53 52 67 40 77 H 83" fill="none" stroke="#FAF7F2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 21 77 H 31" fill="none" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M 91 20 L 92.6 25.4 L 98 27 L 92.6 28.6 L 91 34 L 89.4 28.6 L 84 27 L 89.4 25.4 Z" fill="url(#g)"/>
    </g>
    <text x="34" y="242" font-family="Fraunces,Georgia,serif" font-style="italic" font-size="11" fill="#B9B2D6">Esencia que permanece e innovación que fluye</text>
  </g>
  <text x="270" y="400" text-anchor="middle" font-family="Manrope,sans-serif" font-size="12" letter-spacing="3" fill="#8A8299">ANVERSO · papel marfil mate, símbolo facetado en relieve seco</text>
  <text x="780" y="400" text-anchor="middle" font-family="Manrope,sans-serif" font-size="12" letter-spacing="3" fill="#8A8299">REVERSO · ciruela noche, filo degradado</text>
</svg>
